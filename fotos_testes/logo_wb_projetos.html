<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 200" width="100%" height="100%">
  <defs>
    <!-- Gradiente do Ícone -->
    <linearGradient id="wbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Gradiente do Fundo do Emblema -->
    <linearGradient id="bgBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Filtro de Sombra -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fundo Opcional Escuro (Remova esta linha se quiser fundo 100% transparente) -->
  <rect width="100%" height="100%" fill="#060913" rx="16"/>

  <!-- ================= EMBLEMA / ÍCONE ================= -->
  <g transform="translate(35, 30)">
    <!-- Moldura Tecnológica com Glow -->
    <rect x="0" y="0" width="140" height="140" rx="28" fill="url(#bgBox)" stroke="#1e293b" stroke-width="2" filter="url(#glow)"/>
    <rect x="0" y="0" width="140" height="140" rx="28" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>

    <!-- Elemento Geométrico W + B em Vetor -->
    <g transform="translate(26, 32)">
      <!-- Letra W Estilizada / Vetores de Crescimento -->
      <path d="M 0 10 L 18 75 L 36 30 L 54 75 L 72 10" 
            fill="none" 
            stroke="url(#wbGrad)" 
            stroke-width="9" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
      
      <!-- Linhas que conectam o 'B' e nós de rede comercial -->
      <path d="M 54 10 L 76 10 C 85 10 90 18 90 26 C 90 34 83 40 74 40 C 85 40 92 48 92 58 C 92 68 84 75 72 75 L 54 75" 
            fill="none" 
            stroke="url(#wbGrad)" 
            stroke-width="7.5" 
            stroke-linecap="round" 
            stroke-linejoin="round" />

      <!-- Ponto Tecnológico / Nó Central -->
      <circle cx="36" cy="30" r="4.5" fill="#ffffff" />
      <circle cx="72" cy="40" r="4.5" fill="#38bdf8" />
    </g>
  </g>

  <!-- ================= TEXTOS TIPOGRÁFICOS ================= -->
  <g transform="translate(205, 82)">
    <!-- "WB" -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="1.5" fill="#ffffff">
      WB <tspan fill="#38bdf8">PROJETOS</tspan>
    </text>

    <!-- Divisor Tecnológico -->
    <line x1="0" y1="18" x2="480" y2="18" stroke="#1e293b" stroke-width="2"/>
    <line x1="0" y1="18" x2="160" y2="18" stroke="url(#wbGrad)" stroke-width="2.5"/>

    <!-- Subtítulo -->
    <text x="2" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" letter-spacing="5" fill="#94a3b8">
      GESTÃO COMERCIAL <tspan fill="#38bdf8">•</tspan> SAAS MULTI-TENANT
    </text>
  </g>
</svg>
