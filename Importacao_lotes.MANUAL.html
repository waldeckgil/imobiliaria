<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <title>Importação em Lote - Imóveis e Fotos</title>
    <!-- Importação de frameworks de estilo (Tailwind CSS) e bibliotecas de integração (Supabase e SheetJS) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 p-8">
    <div class="max-w-2xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-6">
        <h1 class="text-xl font-black text-cyan-400">Importação Automatizada de Imóveis & Fotos</h1>
        
        <!-- Passo 1: Campo para upload da planilha contendo as informações dos imóveis -->
        <div class="space-y-2">
            <label class="block text-xs font-bold uppercase text-slate-400">1. Selecionar Planilha de Dados (CSV / Excel)</label>
            <input type="file" id="input-planilha" accept=".csv, .xlsx" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2 text-xs text-slate-300">
            <p class="text-[10px] text-slate-500">A planilha utiliza a coluna <code class="text-cyan-300">proprietario_id</code> com os nomes dos proprietários.</p>
        </div>

        <!-- Passo 2: Campo para seleção múltipla de fotos direto do diretório local -->
        <div class="space-y-2">
            <label class="block text-xs font-bold uppercase text-slate-400">2. Selecionar Fotos dos Imóveis (Múltiplas)</label>
            <input type="file" id="input-fotos" accept="image/*" multiple class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2 text-xs text-slate-300">
            <p class="text-[10px] text-slate-500">Regra: O nome de cada ficheiro de foto deve iniciar com o código de referência do imóvel (Ex: <code class="text-cyan-300">IMO101_01.jpg</code>).</p>
        </div>

        <!-- Botão de disparo do processo de automação -->
        <button onclick="executarImportacaoLote()" class="w-full bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-black py-3 rounded-xl transition cursor-pointer">
            Processar Proprietários e Inserir Imóveis
        </button>

        <!-- Caixa de logs para monitoramento em tempo real do progresso pelo operador -->
        <div id="status-log" class="bg-slate-950 border border-slate-800 rounded-xl p-4 font-mono text-xs text-cyan-300 h-40 overflow-y-auto">
            Aguardando início do processo...
        </div>
    </div>

    <script>
        // Configurações de acesso à API e Storage do Supabase da aplicação
        const SUPABASE_URL = "https://vribzkhqsmvrxwqwdpdn.supabase.co";
        const SUPABASE_PUBLISHABLE_KEY = "sb_publishable__4LrC2zuiNdntaJK4pd-IQ_1CN5pwQV";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        // Identificador padrão correspondente à Imobiliária SGI caso a célula venha vazia
        const ID_IMOBILIARIA_PADRAO = "6bbb3039-ef41-4377-b435-f1ed386c2e36";

        /**
         * Função utilitária para registar mensagens de log na tela do operador.
         */
        function logMensagem(msg) {
            const box = document.getElementById('status-log');
            box.innerHTML += `<div>> ${msg}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        /**
         * Função principal que gere o fluxo completo de importação em massa:
         * 1. Lê a planilha.
         * 2. Verifica ou cria automaticamente os proprietários na tabela `clientes`.
         * 3. Faz o upload das fotos correspondentes no Storage.
         * 4. Regista o imóvel na tabela `imoveis` com o `proprietario_id` em formato UUID correto.
         */
        async function executarImportacaoLote() {
            const arquivoPlanilha = document.getElementById('input-planilha').files[0];
            const arquivosFotos = Array.from(document.getElementById('input-fotos').files);

            if (!arquivoPlanilha) {
                alert('Por favor, selecione a planilha de dados.');
                return;
            }

            logMensagem('A ler a planilha de dados...');

            const reader = new FileReader();
            
            reader.onload = async function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const primeiraAba = workbook.SheetNames[0];
                const linhasImoveis = XLSX.utils.sheet_to_json(workbook.Sheets[primeiraAba]);

                logMensagem(`Total de imóveis encontrados na planilha: ${linhasImoveis.length}`);

                // Cache local para guardar os UUIDs dos proprietários já processados nesta execução
                const cacheProprietarios = new Map();

                for (let imovel of linhasImoveis) {
                    const codigoRef = String(imovel.codigo_ref || '').trim();
                    if (!codigoRef) continue;

                    logMensagem(`A processar imóvel ref: ${codigoRef}...`);

                    // Captura o ID da imobiliária direto da planilha ou assume o padrão
                    const imobiliariaId = String(imovel.imobiliaria_id || ID_IMOBILIARIA_PADRAO).trim();

                    // 1. Captura o nome do proprietário diretamente da coluna proprietario_id da planilha
                    const nomeProprietario = String(
                        imovel.proprietario_id || imovel.nome_proprietario || imovel.proprietario || ''
                    ).trim();

                    let proprietarioIdUuid = null;

                    if (nomeProprietario) {
                        // Verifica se já temos o UUID guardado no cache desta importação
                        if (cacheProprietarios.has(nomeProprietario)) {
                            proprietarioIdUuid = cacheProprietarios.get(nomeProprietario);
                        } else {
                            // Tenta procurar o cliente existente no banco para esta imobiliária
                            const { data: clienteExistente, error: erroBuscaCliente } = await supabaseClient
                                .from('clientes')
                                .select('id')
                                .eq('imobiliaria_id', imobiliariaId)
                                .ilike('nome', nomeProprietario)
                                .maybeSingle();

                            if (clienteExistente) {
                                proprietarioIdUuid = clienteExistente.id;
                                logMensagem(`Proprietário identificado: ${nomeProprietario}`);
                            } else {
                                // Se não existe, regista automaticamente na tabela `clientes` e obtém o UUID
                                logMensagem(`A registar novo proprietário: ${nomeProprietario}...`);
                                const { data: novoCliente, error: erroInsereCliente } = await supabaseClient
                                    .from('clientes')
                                    .insert([{
                                        imobiliaria_id: imobiliariaId,
                                        nome: nomeProprietario,
                                        tipo: 'Proprietario'
                                    }])
                                    .select('id')
                                    .single();

                                if (erroInsereCliente) {
                                    logMensagem(`Erro ao registar proprietário ${nomeProprietario}: ${erroInsereCliente.message}`);
                                } else if (novoCliente) {
                                    proprietarioIdUuid = novoCliente.id;
                                    logMensagem(`Proprietário criado com sucesso (UUID gerado).`);
                                }
                            }

                            // Guarda no cache local para reaproveitar noutros imóveis do mesmo dono
                            if (proprietarioIdUuid) {
                                cacheProprietarios.set(nomeProprietario, proprietarioIdUuid);
                            }
                        }
                    }

                    // 2. Filtra e envia as fotos locais correspondentes ao código de referência
                    const fotosDoImovel = arquivosFotos.filter(f => f.name.includes(codigoRef));
                    let urlsFotos = [];

                    for (let fotoFile of fotosDoImovel) {
                        const caminhoStorage = `${imobiliariaId}/imoveis/${codigoRef}/${Date.now()}_${fotoFile.name}`;
                        logMensagem(`A enviar foto ${fotoFile.name} para o Storage...`);

                        const { data: uploadData, error: uploadError } = await supabaseClient.storage
                            .from('imoveis-midias')
                            .upload(caminhoStorage, fotoFile);

                        if (!uploadError) {
                            const { data: publicUrlData } = supabaseClient.storage.from('imoveis-midias').getPublicUrl(caminhoStorage);
                            urlsFotos.push(publicUrlData.publicUrl);
                        } else {
                            logMensagem(`Erro ao enviar foto: ${uploadError.message}`);
                        }
                    }

                    const fotoCapa = urlsFotos.length > 0 ? urlsFotos[0] : null;

                    // 3. Executa a inserção do imóvel no banco de dados com o UUID correto
                    const { error: insertError } = await supabaseClient.from('imoveis').insert([{
                        imobiliaria_id: imobiliariaId,
                        codigo_ref: codigoRef,
                        titulo: imovel.titulo || `Imóvel ${codigoRef}`,
                        tipo: imovel.tipo || 'Casa',
                        finalidade: imovel.finalidade || 'Venda',
                        bairro: imovel.bairro || null,
                        valor_venda: imovel.valor_venda ? Number(imovel.valor_venda) : null,
                        valor_locacao: imovel.valor_locacao ? Number(imovel.valor_locacao) : null,
                        area_util: imovel.area_util ? Number(imovel.area_util) : null,
                        quartos: imovel.quartos ? Number(imovel.quartos) : 0,
                        vagas: imovel.vagas ? Number(imovel.vagas) : 0,
                        status: imovel.status || 'Disponível',
                        ativa: imovel.ativa !== undefined ? Boolean(imovel.ativa) : true,
                        foto_capa: fotoCapa,
                        fotos: urlsFotos,
                        proprietario_id: proprietarioIdUuid // UUID definitivo obtido da tabela clientes
                    }]);

                    if (insertError) {
                        logMensagem(`Erro ao inserir imóvel ${codigoRef}: ${insertError.message}`);
                    } else {
                        logMensagem(`Imóvel ${codigoRef} inserido com sucesso com ${urlsFotos.length} foto(s)!`);
                    }
                }

                logMensagem('Importação em lote concluída com sucesso!');
            };

            reader.readAsArrayBuffer(arquivoPlanilha);
        }
    </script>
</body>
</html>
